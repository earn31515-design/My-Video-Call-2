<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Group Video Call</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #000; color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        .start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #111; z-index: 1000; gap: 15px; padding: 20px; text-align: center;
        }
        .start-screen button {
            padding: 12px 24px; font-size: 16px; background: #4CAF50; 
            color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .controls {
            position: absolute; top: 6px; left: 6px; right: 6px;
            z-index: 100; display: flex; flex-direction: column; gap: 4px;
            background: rgba(0, 0, 0, 0.85); padding: 8px; border-radius: 8px;
            display: none;
        }
        .input-group { display: flex; gap: 5px; }
        input {
            flex: 1; padding: 6px 8px; font-size: 13px;
            border-radius: 4px; border: 1px solid #444;
            background: #222; color: #fff;
        }
        button {
            padding: 6px 12px; background: #4CAF50; color: white;
            border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-blue { background: #2196F3; }
        .btn-red { background: #f44336; padding: 6px 8px; font-size: 11px; }

        /* အလိုအလျောက် ပြောင်းလဲမည့် Grid စနစ် */
        .video-grid {
            width: 100vw; height: 100vh;
            display: grid;
            gap: 4px; padding: 4px; background: #000;
            padding-top: 85px;
        }
        .video-grid.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .video-grid.layout-2 { grid-template-columns: 1fr; grid-template-rows: repeat(2, 1fr); }
        .video-grid.layout-3, .video-grid.layout-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }

        .video-box {
            position: relative; width: 100%; height: 100%;
            background: #111; border-radius: 8px; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid #333;
        }
        video {
            width: 100%; height: 100%; object-fit: cover; background: #111;
        }
        .label {
            position: absolute; bottom: 6px; left: 6px;
            background: rgba(0, 0, 0, 0.7); padding: 2px 6px;
            border-radius: 4px; font-size: 10px; color: #fff;
        }
        .status-box {
            position: absolute; bottom: 8px; left: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid #444;
            padding: 5px 8px; border-radius: 6px; font-size: 11px;
            z-index: 100; color: #ff9800; text-align: center;
        }
    </style>
</head>
<body>

    <div id="start-screen" class="start-screen">
        <h2>Dynamic Group Video Call</h2>
        <p>ဗီဒီယိုကောလ် စတင်ရန် ကင်မရာကို ဖွင့်ပါ</p>
        <button id="start-cam-btn">ကင်မရာ စတင်ဖွင့်မည်</button>
    </div>

    <div class="controls" id="controls-panel">
        <div class="input-group">
            <input type="text" id="my-custom-id" placeholder="ကိုယ့် ID အမည် (ဥပမာ - A1)">
            <button id="set-id-btn" class="btn-blue">မှတ်မည်</button>
            <button id="reset-id-btn" class="btn-red">ဖျက်ရန်</button>
        </div>
        <div class="input-group">
            <input type="text" id="peer-id-input" placeholder="ချိတ်မည့်သူ့ ID ထည့်ရန်" disabled>
            <button id="connect-btn" disabled>ချိတ်ဆက်မည်</button>
        </div>
    </div>

    <!-- စစချင်းတွင် ကိုယ့်ဗီဒီယို ၁ ကွက်တည်းသာ ရှိမည် -->
    <div class="video-grid layout-1" id="video-grid">
        <div class="video-box" id="local-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">ကိုယ် (Local)</div>
        </div>
    </div>

    <div class="status-box" id="status-text">ကင်မရာ ဖွင့်ရန် ခလုတ်ကို နှိပ်ပါ</div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const controlsPanel = document.getElementById('controls-panel');
        const startCamBtn = document.getElementById('start-cam-btn');
        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('local-video');
        const myCustomIdInput = document.getElementById('my-custom-id');
        const setIdBtn = document.getElementById('set-id-btn');
        const resetIdBtn = document.getElementById('reset-id-btn');
        const peerIdInput = document.getElementById('peer-id-input');
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');

        let localStream;
        let peer;
        let activeCalls = {};

        function updateGridLayout() {
            const boxes = videoGrid.querySelectorAll('.video-box');
            const count = boxes.length;
            videoGrid.className = 'video-grid layout-' + Math.min(count, 4);
        }

        startCamBtn.addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    startScreen.style.display = 'none';
                    controlsPanel.style.display = 'flex';

                    const savedId = localStorage.getItem('saved_group_id');
                    if (savedId) {
                        myCustomIdInput.value = savedId;
                        initPeer(savedId);
                    } else {
                        statusText.innerText = "ကင်မရာပွင့်ပြီ၊ ကိုယ့် ID အမည် သတ်မှတ်ပါ";
                    }
                })
                .catch(err => {
                    alert('ကင်မရာ (သို့) မိုက်ဖုန်း ခွင့်ပြုချက် ပိတ်ထားပါသည် သို့မဟုတ် အသုံးမပြုနိုင်ပါ။');
                });
        });

        function initPeer(id) {
            if (peer) peer.destroy();
            peer = new Peer(id);

            peer.on('open', (assignedId) => {
                statusText.innerText = "ကိုယ့် ID: " + assignedId + " (အသင့်ဖြစ်ပါပြီ)";
                myCustomIdInput.disabled = true;
                setIdBtn.disabled = true;
                peerIdInput.disabled = false;
                connectBtn.disabled = false;
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('ဤ ID ကို အခြားသူ ယူထားပြီးပါပြီ။ နာမည်အသစ်ပြောင်းပါ။');
                    localStorage.removeItem('saved_group_id');
                    myCustomIdInput.disabled = false;
                    setIdBtn.disabled = false;
                } else {
                    alert('Error: ' + err.type);
                }
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                setupCall(call);
            });
        }

        function setupCall(call) {
            const remotePeerId = call.peer;
            if (activeCalls[remotePeerId]) return;

            if (Object.keys(activeCalls).length >= 3) {
                call.close();
                return;
            }

            activeCalls[remotePeerId] = call;

            const videoBox = document.createElement('div');
            videoBox.className = 'video-box';
            videoBox.id = 'box-' + remotePeerId;

            const remoteVideo = document.createElement('video');
            remoteVideo.autoplay = true;
            remoteVideo.playsinline = true;

            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = remotePeerId;

            videoBox.appendChild(remoteVideo);
            videoBox.appendChild(label);
            videoGrid.appendChild(videoBox);

            updateGridLayout();

            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusText.innerText = remotePeerId + " နှင့် ချိတ်ဆက်ပြီးပါပြီ";
            });

            call.on('close', () => {
                removeRemoteBox(remotePeerId);
            });

            call.on('error', () => {
                removeRemoteBox(remotePeerId);
            });
        }

        function removeRemoteBox(remotePeerId) {
            const box = document.getElementById('box-' + remotePeerId);
            if (box) box.remove();
            delete activeCalls[remotePeerId];
            updateGridLayout();
            statusText.innerText = remotePeerId + " ထွက်သွားပါပြီ";
        }

        setIdBtn.addEventListener('click', () => {
            const customId = myCustomIdInput.value.trim();
            if (!customId) {
                alert('ကျေးဇူးပြု၍ ကိုယ့် ID အမည် ထည့်ပါ။');
                return;
            }
            localStorage.setItem('saved_group_id', customId);
            initPeer(customId);
        });

        resetIdBtn.addEventListener('click', () => {
            localStorage.removeItem('saved_group_id');
            myCustomIdInput.disabled = false;
            setIdBtn.disabled = false;
            peerIdInput.disabled = true;
            connectBtn.disabled = true;
            myCustomIdInput.value = "";
            statusText.innerText = "ID ဖျက်ပြီးပါပြီ။";
            if (peer) peer.destroy();

            Object.keys(activeCalls).forEach(id => {
                const box = document.getElementById('box-' + id);
                if (box) box.remove();
            });
            activeCalls = {};
            updateGridLayout();
        });

        connectBtn.addEventListener('click', () => {
            const targetId = peerIdInput.value.trim();
            if (!targetId) {
                alert('ချိတ်မည့်သူ၏ ID ကို ထည့်ပါ။');
                return;
            }
            if (activeCalls[targetId]) {
                alert('ဤသူနှင့် ချိတ်ဆက်ပြီးသား ဖြစ်ပါသည်။');
                return;
            }
            if (Object.keys(activeCalls).length >= 3) {
                alert('အခန်းတွဲတွင် လူပြည့်နေပါပြီ (အများဆုံး ၄ ယောက်)။');
                return;
            }

            statusText.innerText = targetId + " သို့ ချိတ်ဆက်နေသည်...";
            const call = peer.call(targetId, localStream);
            setupCall(call);
            peerIdInput.value = "";
        });
    </script>
</body>
</html>
