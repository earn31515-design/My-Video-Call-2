
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V Call App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #efeae2; display: flex; flex-direction: column; height: 100vh; }
        .app-header { background-color: #008069; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; flex-direction: column; }
        .app-title { font-size: 18px; font-weight: bold; }
        #my-id-display { font-size: 12px; color: #b3dfd6; }
        .call-actions button { background-color: #01a884; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .video-container { display: none; background-color: #111b21; padding: 10px; position: relative; height: 250px; gap: 10px; justify-content: center; }
        video { width: 48%; height: 100%; background-color: #222; border-radius: 8px; object-fit: cover; }
        .end-call-btn { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background-color: #ea0038; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background-color: #efeae2; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 15px; position: relative; word-wrap: break-word; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; }
        .message.received { background-color: white; align-self: flex-start; }
        .message img { max-width: 100%; border-radius: 6px; display: block; }
        .message .time { font-size: 10px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        .input-area { background-color: #f0f2f5; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .icon-btn { font-size: 22px; cursor: pointer; }
        #file-input { display: none; }
        #text-input { flex: 1; padding: 10px 16px; border: none; border-radius: 20px; outline: none; background-color: white; }
        #send-btn { background-color: #00a884; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
    <!-- Firebase Libraries များကို ပိုမိုအဆင်ပြေမည့် CDN ကနေ ကြိုတင်ဖတ်ရှုခြင်း -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div class="app-header">
        <div class="user-info">
            <span class="app-title">ဦးထွန်းနောင်၏ကိုယ်ပိုင် Vcall</span>
            <span id="my-id-display">လိုင်းချိတ်ဆက်နေသည်...</span>
        </div>
        <div class="call-actions">
            <button id="call-btn">📞 Video Call</button>
        </div>
    </div>

    <div class="video-container" id="video-area">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
        <button class="end-call-btn" id="end-call-btn">ဖုန်းချရန်</button>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-area">
        <label class="icon-btn" for="file-input">📷</label>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="text-input" placeholder="စာရိုက်ပါ...">
        <button id="send-btn">➔</button>
    </div>

    <script>
        // သင့်ရဲ့ Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD_obkR0Gcuw9LiVkpvbrj4BwAbsin4eig",
            authDomain: "://firebaseapp.com",
            projectId: "my-vcall-app",
            storageBucket: "my-vcall-app.firebasestorage.app",
            messagingSenderId: "40185075160",
            appId: "1:40185075160:web:980195d514b1f53fe00ead",
            measurementId: "G-84FFEXTMLX"
        };

        // Firebase Initialize လုပ်ခြင်း
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        // အသုံးပြုသူ ID သတ်မှတ်ခြင်း
        const myUserId = "User_" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('my-id-display').innerText = "သင့် ID: " + myUserId;

        const chatContainer = document.getElementById('chat-container');
        const textInput = document.getElementById('text-input');
        const fileInput = document.getElementById('file-input');
        const sendBtn = document.getElementById('send-btn');
        const callBtn = document.getElementById('call-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const videoArea = document.getElementById('video-area');

        let localStream;
        let peerConnection;
        const rtcConfig = { iceServers: [{ urls: "stun:://google.com" }] };

        // --- စာပို့စနစ် ---
        function sendMessage(text, imageUrl = null) {
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            database.ref('messages').push({
                sender: myUserId,
                text: text,
                imageUrl: imageUrl,
                time: timeString
            });
            textInput.value = '';
            fileInput.value = '';
        }

        sendBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const file = fileInput.files[0];
            if (!text && !file) return;

            sendBtn.disabled = true;
            if (file) {
                const fRef = storage.ref('images/' + Date.now() + '_' + file.name);
                try {
                    await fRef.put(file);
                    const url = await fRef.getDownloadURL();
                    sendMessage(text, url);
                } catch(e) { alert("Error uploading image"); }
            } else {
                sendMessage(text);
            }
            sendBtn.disabled = false;
        });

        textInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        database.ref('messages').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${data.sender === myUserId ? 'sent' : 'received'}`;
            let content = data.imageUrl ? `<img src="${data.imageUrl}">` : '';
            content += data.text ? `<p>${data.text}</p>` : '';
            content += `<span class="time">${data.time}</span>`;
            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        // --- Video Call စနစ် ---
        async function startWebcam() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (e) {
                alert("ကင်မရာ သို့မဟုတ် မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်၏");
            }
        }

        async function createPeer(callId) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            if(localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    database.ref(`calls/${callId}/candidates`).push(event.candidate.toJSON());
                }
            };
        }

        callBtn.addEventListener('click', async () => {
            const targetId = prompt("သင်ခေါ်ဆိုလိုသော တစ်ဖက်လူ၏ ID ကို ရိုက်ထည့်ပါ:");
            if (!targetId) return;

            videoArea.style.display = "flex";
            await startWebcam();
            await createPeer(targetId);

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await database.ref(`calls/${targetId}`).set({
                offer: { type: offer.type, sdp: offer.sdp },
                caller: myUserId
            });

            database.ref(`calls/${targetId}/answer`).on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && peerConnection.signalingState !== "stable") {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });

            database.ref(`calls/${targetId}/candidates`).on('child_added', (snapshot) => {
                const candidate = snapshot.val();
                if (candidate) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });
        });

        database.ref(`calls/${myUserId}`).on('value', async (snapshot) => {
            const callData = snapshot.val();
            if (callData && callData.offer && !peerConnection) {
                if (confirm(`${callData.caller} ထံမှ Video Call လာနေပါသည်။ လက်ခံမလား?`)) {
                    videoArea.style.display = "flex";
                    await startWebcam();
                    await createPeer(myUserId);

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
