
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V Call App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .app-header {
            background-color: #008069;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info {
            display: flex;
            flex-direction: column;
        }
        .app-title {
            font-size: 18px;
            font-weight: bold;
        }
        #my-id-display {
            font-size: 12px;
            color: #b3dfd6;
        }
        .call-actions button {
            background-color: #01a884;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .video-container {
            display: none;
            background-color: #111b21;
            padding: 10px;
            position: relative;
            height: 250px;
            gap: 10px;
            justify-content: center;
        }
        video {
            width: 48%;
            height: 100%;
            background-color: #222;
            border-radius: 8px;
            object-fit: cover;
        }
        .end-call-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ea0038;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #efeae2;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
        }
        .message.sent {
            background-color: #d9fdd3;
            align-self: flex-end;
        }
        .message.received {
            background-color: white;
            align-self: flex-start;
        }
        .message img {
            max-width: 100%;
            border-radius: 6px;
            display: block;
        }
        .message .time {
            font-size: 10px;
            color: #667781;
            display: block;
            text-align: right;
            margin-top: 4px;
        }
        .input-area {
            background-color: #f0f2f5;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            font-size: 22px;
            cursor: pointer;
        }
        #file-input {
            display: none;
        }
        #text-input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            outline: none;
            background-color: white;
        }
        #send-btn {
            background-color: #00a884;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</script>
</head>
<body>

    <div class="app-header">
        <div class="user-info">
            <span class="app-title">V Call (ထွန်းထွန်းနောင်)</span>
            <span id="my-id-display">လိုင်းချိတ်ဆက်နေသည်...</span>
        </div>
        <div class="call-actions">
            <button id="call-btn">📞 Video Call</button>
        </div>
    </div>

    <div class="video-container" id="video-area">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
        <button class="end-call-btn" id="end-call-btn">ဖုန်းချရန်</button>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-area">
        <label class="icon-btn" for="file-input">📷</label>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="text-input" placeholder="စာရိုက်ပါ...">
        <button id="send-btn">➔</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, set, onChildAdded, onValue, remove } from "https://gstatic.com";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyD_obkR0Gcuw9LiVkpvbrj4BwAbsin4eig",
            authDomain: "://firebaseapp.com",
            projectId: "my-vcall-app",
            storageBucket: "my-vcall-app.firebasestorage.app",
            messagingSenderId: "40185075160",
            appId: "1:40185075160:web:980195d514b1f53fe00ead",
            measurementId: "G-84FFEXTMLX"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const storage = getStorage(app);

        const myUserId = "User_" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('my-id-display').innerText = "သင့် ID: " + myUserId;

        const chatContainer = document.getElementById('chat-container');
        const textInput = document.getElementById('text-input');
        const fileInput = document.getElementById('file-input');
        const sendBtn = document.getElementById('send-btn');
        const callBtn = document.getElementById('call-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const videoArea = document.getElementById('video-area');

        let localStream;
        let peerConnection;
        const rtcConfig = { iceServers: [{ urls: "stun:://google.com" }] };

        function sendMessage(text, imageUrl = null) {
            const messagesRef = ref(database, 'messages');
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            push(messagesRef, {
                sender: myUserId,
                text: text,
                imageUrl: imageUrl,
                time: timeString
            });
            textInput.value = '';
            fileInput.value = '';
        }

        sendBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const file = fileInput.files[0];
            if (!text && !file) return;

            sendBtn.disabled = true;
            if (file) {
                const fRef = storageRef(storage, 'images/' + Date.now() + '_' + file.name);
                try {
                    await uploadBytes(fRef, file);
                    const url = await getDownloadURL(fRef);
                    sendMessage(text, url);
                } catch(e) { alert("Error uploading image"); }
            } else {
                sendMessage(text);
            }
            sendBtn.disabled = false;
        });

        textInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        onChildAdded(ref(database, 'messages'), (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${data.sender === myUserId ? 'sent' : 'received'}`;
            let content = data.imageUrl ? `<img src="${data.imageUrl}">` : '';
            content += data.text ? `<p>${data.text}</p>` : '';
            content += `<span class="time">${data.time}</span>`;
            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        async function startWebcam() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
        }

        async function createPeer(callId) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(database, `calls/${callId}/candidates`), event.candidate.toJSON());
                }
            };
        }

        callBtn.addEventListener('click', async () => {
            const targetId = prompt("သင်ခေါ်ဆိုလိုသော တစ်ဖက်လူ၏ ID ကို ရိုက်ထည့်ပါ:");
            if (!targetId) return;

            videoArea.style.display = "flex";
            await startWebcam();
            await createPeer(targetId);

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await set(ref(database, `calls/${targetId}`), {
                offer: { type: offer.type, sdp: offer.sdp },
                caller: myUserId
            });

            onValue(ref(database, `calls/${targetId}/answer`), async (snapshot) => {
                const answer = snapshot.val();
